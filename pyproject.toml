[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunter"
version = "0.1.0"
description = "Policy-gated, human-like bug bounty hunting assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "dnspython>=2.6,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bughunter = "bughunter.cli:main"

[tool.setuptools.packages.find]
include = ["bughunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
